# npm/pnpm version updates are intentionally NOT handled here (they burn Actions minutes on private repos):
# dependencies are bumped in one locally verified commit per repo (the `bump-deps` sweep, monthly).
# Dependabot *security* updates stay on (repository setting, no config needed).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
